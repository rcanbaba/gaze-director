name: GazeDirector
options:
  bundleIdPrefix: com.rcanbaba
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # ARB Technology and Trade Consulting OU
    DEVELOPMENT_TEAM: V4AN9PQ642
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  GazeCore:
    path: GazeCore
targets:
  GazeDirector:
    type: application
    platform: macOS
    sources:
      - path: GazeDirector
        excludes:
          - Resources/Gifts
      # Folder reference, so the demo gifts land in Contents/Resources/Gifts.
      - path: GazeDirector/Resources/Gifts
        type: folder
        buildPhase: resources
      - path: GazeCamera/GazeCameraShared.swift
    dependencies:
      - package: GazeCore
      - target: GazeCamera
    info:
      path: GazeDirector/Info.plist
      properties:
        CFBundleDisplayName: Gaze Director
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: Gaze Director uses the camera to track your eyes and redirect your gaze.
        NSMicrophoneUsageDescription: Gaze Director listens for your voice so it can glance away more often while you speak.
    entitlements:
      path: GazeDirector/GazeDirector.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.developer.system-extension.install: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcanbaba.GazeDirector
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  # Core Media I/O camera extension: the "Gaze Director" camera other apps can pick.
  GazeCamera:
    type: system-extension
    platform: macOS
    sources:
      - path: GazeCamera
    info:
      path: GazeCamera/Info.plist
      properties:
        CFBundleDisplayName: Gaze Director Camera
        # sysextd rejects extensions whose package type is not SYSX.
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSSystemExtensionUsageDescription: Provides the Gaze Director camera with gaze-corrected video from the Gaze Director app.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    entitlements:
      path: GazeCamera/GazeCamera.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.rcanbaba.GazeDirector.GazeCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcanbaba.GazeDirector.GazeCamera
        # System extension bundles are named after their identifier.
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  GazeDirector:
    build:
      targets:
        GazeDirector: all
    # The per-frame iris search is plain Swift loops; unoptimised builds are several times slower.
    run:
      config: Release
    archive:
      config: Release
